# https://git.drupalcode.org/project/gitlab_templates/

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

.manual-rule: &manual-rule
  - when: manual
    allow_failure: true

.skip-phpmd-rule: &skip-phpmd-rule
  if: '$SKIP_PHPMD == "1"'
  when: never

.phpmd-base:
  stage: validate
  rules:
    - !reference [.opt-in-current-rule]
    - *skip-phpmd-rule
    - !reference [.php-files-exist-rule]
  needs:
    - composer
  before_script:
    - curl -fsSL https://phpmd.org/static/latest/phpmd.phar -o vendor/bin/phpmd
    - chmod +x vendor/bin/phpmd
  script:
    - php --version
    - vendor/bin/phpmd --version
    - sed -i "s#/builds/project/ui_icons#${CI_PROJECT_DIR}#g" ${_WEB_ROOT}/modules/custom/${CI_PROJECT_NAME}/.phpmd.baseline.xml
    - vendor/bin/phpmd
        $_WEB_ROOT/modules/custom/$CI_PROJECT_NAME
        gitlab
        $_WEB_ROOT/modules/custom/$CI_PROJECT_NAME/.phpmd.xml
        --exclude 'tests/*,**/tests/*'
        --baseline-file $_WEB_ROOT/modules/custom/$CI_PROJECT_NAME/.phpmd.baseline.xml > phpmd-quality-report.json || true
    - vendor/bin/phpmd
        $_WEB_ROOT/modules/custom/$CI_PROJECT_NAME
        text
        $_WEB_ROOT/modules/custom/$CI_PROJECT_NAME/.phpmd.xml
        --exclude 'tests/*,**/tests/*'
        --baseline-file $_WEB_ROOT/modules/custom/$CI_PROJECT_NAME/.phpmd.baseline.xml
  allow_failure: true
  artifacts:
    expose_as: phpmd
    when: always
    expire_in: 6 mos
    reports:
      codequality: phpmd-quality-report.json
    name: artifacts-$CI_PIPELINE_ID-$CI_JOB_NAME_SLUG
    paths:
      - phpmd-quality-report.json

phpmd:
  extends: .phpmd-base

## Pages / documentation job ##

pages:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - zensical.toml
      changes: &doc-changed-files-path
        - docs/**/*
        - zensical.toml
    - if: $_PAGES_FORCE_REBUILD == "1" && $CI_PIPELINE_SOURCE =~ /(schedule|web)/
      exists:
    - *manual-rule
  needs: []
  image: python:latest
  script:
    - echo -e "\e[0Ksection_start:`date +%s`:build_docs[collapsed=true]\r\e[0KInstall Zensical and build the documentation site"
    - python3 -m venv .venv
    - source .venv/bin/activate
    - pip install zensical
    - echo -e "\e[0Ksection_end:`date +%s`:build_docs\r\e[0K"
    - zensical build --clean
    - printf "Documentation site available at $CI_PAGES_URL\n"
  artifacts:
    paths:
      - public
